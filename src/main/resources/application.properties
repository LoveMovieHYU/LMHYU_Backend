spring.application.name=Movie

# Batch Config
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql
batch.seedversion=v1.1.0

# Meta Data
spring.datasource-meta.driver-class-name=${DRIVER}
spring.datasource-meta.jdbc-url=${MYSQL_META_URL}
spring.datasource-meta.username=${MYSQL_META_USERNAME}
spring.datasource-meta.password=${MYSQL_META_PASSWORD}

# DataBase
spring.datasource-data.driver-class-name=${DRIVER}
spring.datasource-data.jdbc-url=${MYSQL_DATA_URL}
spring.datasource-data.username=${MYSQL_DATA_USERNAME}
spring.datasource-data.password=${MYSQL_DATA_PASSWORD}

# Tmdb
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.base-url=https://api.themoviedb.org/3

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

## Swagger Configuration
springdoc.paths-to-match=/api/**
spring.main.allow-bean-definition-overriding=true

# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://10.0.2.2.nip.io:8080/login/oauth2/code/google
#spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=http://10.0.2.2:8080/login/oauth2/code/naver
#spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
